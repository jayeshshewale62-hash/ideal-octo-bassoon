<!doctype html><html><body style="margin:0;background:#9fb7d6">
<canvas id="c" width="2400" height="2200"></canvas>
<script type="module">
// character test sheet: node render.mjs page charsheet.html out.png (edit the cells for your cast)
import * as T from "./toon.js"; import * as C from "./castdefs.js";
const g = document.getElementById("c").getContext("2d");
const cell = (i, j, fn, w = 600, h = 1000) => { g.save(); g.translate(i * 480 - 60, j * 1080 + 40); g.scale(0.8, 0.8); g.translate((600 - w) / 2, 1000 - h); fn(new T.Pen(g)); g.restore(); };
const L = -Math.PI * 2 / 3;
cell(0, 0, (p) => T.bodyFrontX(p, C.GROCER, { expr: "stubborn", armL: "hip", armR: "point", seed: 3, light: L }));
cell(1, 0, (p) => T.bodyFrontX(p, C.MAYOR, { expr: "laugh", armL: "belly", armR: "belly", seed: 7, light: L }));
cell(2, 0, (p) => T.bodyFrontX(p, C.TOWN_1, { expr: "rage", armR: "wave", seed: 9, light: L, comic: { rage: 1 } }));
cell(3, 0, (p) => T.bodyFrontX(p, C.TOWN_2, { expr: "worried", armR: "chin", seed: 11, light: L, comic: { sweat: 0.4 } }));
cell(4, 0, (p) => T.bodyFrontX(p, C.TOWN_KID, { expr: "whiteout", armL: "up", armR: "up", seed: 13, light: L, comic: { whiteout: 1, lines: 1 } }));
cell(0, 1, (p) => T.bodySideX(p, C.GROCER, { mode: "walk", phase: 0.2, push: true, lean0: 9, expr: "strain", seed: 3, light: L }));
cell(1, 1, (p) => T.bodySideX(p, C.MAYOR, { mode: "walk", phase: 0.6, expr: "smug", seed: 7, light: L }));
cell(2, 1, (p) => T.bodySideX(p, C.TOWN_1, { mode: "stand", armsUp: true, expr: "shock", seed: 9, light: L, comic: { lines: 1 } }));
cell(3, 1, (p) => T.bodySideX(p, C.TOWN_2, { mode: "walk", phase: 0.4, expr: "calm", seed: 11, light: L }));
cell(4, 1, (p) => T.bodySideX(p, C.TOWN_KID, { mode: "walk", phase: 0.1, expr: "grin", seed: 13, light: L, comic: { steam: 0.5 } }));
window.done = true;
</script></body></html>
