# Render profiles: definitions only. The renderer arrives in later milestones.
# Schema: studio.core.schemas.RenderProfilesFile (schema_version 1).
# Frame rate is a per-profile setting; the animation clock is in seconds, so any fps works.
schema_version: 1
default: hd1080p24

profiles:
  hd1080p24:
    label: Full HD 1920x1080 @ 24 fps (default delivery)
    purpose: final
    width: 1920
    height: 1080
    fps: 24
    video: {container: mp4, codec: h264, encoder: libx264, profile: high, pix_fmt: yuv420p,
            crf: 18, preset: medium, color_space: bt709, faststart: true}
    audio: {codec: aac, sample_rate: 48000, channels: 2, bitrate_kbps: 256,
            loudness_lufs: -14.0, true_peak_dbtp: -1.0}

  hd1080p30:
    label: Full HD 1920x1080 @ 30 fps
    purpose: final
    width: 1920
    height: 1080
    fps: 30
    video: {container: mp4, codec: h264, encoder: libx264, profile: high, pix_fmt: yuv420p,
            crf: 18, preset: medium, color_space: bt709, faststart: true}
    audio: {codec: aac, sample_rate: 48000, channels: 2, bitrate_kbps: 256,
            loudness_lufs: -14.0, true_peak_dbtp: -1.0}

  uhd2160p24:
    label: 4K UHD 3840x2160 @ 24 fps (external render node recommended)
    purpose: final
    width: 3840
    height: 2160
    fps: 24
    video: {container: mp4, codec: h264, encoder: libx264, profile: high, pix_fmt: yuv420p,
            crf: 18, preset: slow, color_space: bt709, faststart: true}
    audio: {codec: aac, sample_rate: 48000, channels: 2, bitrate_kbps: 320,
            loudness_lufs: -14.0, true_peak_dbtp: -1.0}

  preview540p12:
    label: Preview 960x540 @ 12 fps (animatics, fast checks)
    purpose: preview
    width: 960
    height: 540
    fps: 12
    video: {container: mp4, codec: h264, encoder: libx264, profile: high, pix_fmt: yuv420p,
            crf: 26, preset: veryfast, color_space: bt709, faststart: true}
    audio: {codec: aac, sample_rate: 48000, channels: 2, bitrate_kbps: 128,
            loudness_lufs: -14.0, true_peak_dbtp: -1.0}
