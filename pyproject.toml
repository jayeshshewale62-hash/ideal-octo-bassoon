[project]
name = "motion-animation-studio"
version = "0.4.0"
description = "Motion Animation Studio: a rig-first, data-driven 2D animation production system with replaceable AI providers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - all rights reserved (see README)" }
authors = [{ name = "Motion Animation Studio contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
# Core vector-rendering backend (used from Milestone 3 onwards). Optional so the
# foundation installs without native graphics libraries.
render = [
    "skia-python>=138",
    "numpy>=2.1",
]

[project.scripts]
studio = "studio.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.hatch.build.targets.sdist]
include = ["studio", "config", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess calls use fixed argument lists, never a shell
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["studio"]

[[tool.mypy.overrides]]
module = ["skia", "numpy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "render: needs the optional 'render' extra (skia-python); skipped when it is not installed",
]
